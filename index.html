<!DOCTYPE html>
<html>
<head>
    <title>Virtual Invitation - MEDevice Boston 2025</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }

        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 1s;
        }

        .envelope.open {
            transform: rotateY(180deg);
        }

        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
        }

        .front {
            background-color: #fff;
            border: 2px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .back {
            background-color: #fff;
            border: 2px solid #000;
            transform: rotateY(180deg);
        }

        .letter {
            position: absolute;
            width: 280px;
            height: 180px;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            opacity: 0;
            transition: transform 0.5s, opacity 0.5s;
            transform: translateY(20px);
        }

        .letter.show {
            opacity: 1;
            transform: translateY(-100px);
        }

        .flap {
            position: absolute;
            width: 100%;
            height: 100px;
            background-color: #fff;
            border: 2px solid #000;
            transform-origin: top;
            transition: transform 0.5s;
        }

        .envelope.open .flap {
            transform: rotateX(-180deg);
        }
    </style>
</head>
<body>
    <div class="envelope" onclick="openEnvelope()">
        <div class="front">
            <p>Click to open</p>
        </div>
        <div class="back">
            <div class="flap"></div>
            <div class="letter">
                <h2>Dear <span id="guest-name">[name]</span>,</h2>
                <p>You are personally invited to attend MEDevice Boston 2025.</p>
                <p>The event has been reimagined into a fully curated event experience that is Engineered to Advance your business.</p>
            </div>
        </div>
    </div>

    <script>
        function openEnvelope() {
            const envelope = document.querySelector('.envelope');
            const letter = document.querySelector('.letter');
            
            if (!envelope.classList.contains('open')) {
                envelope.classList.add('open');
                setTimeout(() => {
                    letter.classList.add('show');
                }, 500);
            }
        }

        // Function to set recipient name
        function setRecipientName(name) {
            document.getElementById('guest-name').textContent = name;
        }

        // Example usage:
        // setRecipientName('John Doe');
    </script>
</body>
</html>
